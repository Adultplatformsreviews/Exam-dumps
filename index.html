// Banner library per site (IndexedDB)
const BDB=new Promise((ok,no)=>{const r=indexedDB.open('banner_lib',1);r.onupgradeneeded=()=>r.result.createObjectStore('b',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function bTx(mode,fn){const db=await BDB;return new Promise((ok,no)=>{const t=db.transaction('b',mode),st=t.objectStore('b');const r=fn(st);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})}
const bAll=async site=>(await bTx('readonly',st=>st.getAll())||[]).filter(x=>x.site==site);
let BCACHE={};
async function renderBan(site){const el=$('#gban');if(!el)return;if(!site){el.innerHTML='<i>Select a site to see its banners.</i>';return}
const L=await bAll(site);L.forEach(b=>BCACHE[b.id]=b);
el.innerHTML=`<div style="margin-bottom:8px"><button class="btn sm g" onclick="bUpload('${site}')">+ Upload ${site} banners</button> <button class="btn sm s" onclick="bUrl('${site}')">+ Add by image URL</button> <small style="color:#6b7280">${L.length} banners. Click a banner to insert it in the editor.</small></div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;background:#8fbf8f;padding:10px;border-radius:6px;max-height:600px;overflow:auto">${L.map(b=>`<div style="background:#fff;padding:4px;border-radius:4px;text-align:center;position:relative"><img src="${b.src}" title="Insert ${esc(b.name)}" onclick="bIns(${b.id})" style="width:100%;height:90px;object-fit:contain;cursor:pointer"><div style="font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(b.name)}</div><span onclick="bDel(${b.id},'${site}')" title="Delete" style="position:absolute;top:2px;right:6px;cursor:pointer;color:#dc2626;font-weight:bold">×</span></div>`).join('')||'<i style="color:#fff">No banners yet for this site. Upload them once and they will appear every time you pick this site.</i>'}</div>`}
function bUpload(site){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=async()=>{for(const f of i.files){const src=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)});await bTx('readwrite',st=>st.add({site,name:f.name.replace(/\.[^.]+$/,''),src}))}toast(i.files.length+' banners added');renderBan(site)};i.click()}
async function bUrl(site){const u=prompt('Image URL(s), one per line:');if(!u)return;const L=u.split('\n').map(x=>x.trim()).filter(Boolean);for(const src of L)await bTx('readwrite',st=>st.add({site,name:src.split('/').pop().replace(/\.[^.]+$/,''),src}));toast(L.length+' banners added');renderBan(site)}
async function bDel(id,site){if(!confirm('Delete this banner?'))return;await bTx('readwrite',st=>st.delete(id));renderBan(site)}
function bIns(id){const b=BCACHE[id];if(!b)return;const h='<p><img src="'+b.src+'" alt="'+esc(b.name)+'" style="max-width:100%"></p>';if(ED){ED.focus();ED.insertHtml(h)}else{$('#grte').value+=h}}
function ins(t){if(ED){ED.focus();ED.insertText(t)}else{$('#grte').value+=t}}
R.gen=()=>genPage(false);R.gencert=()=>genPage(true);
// DMCA
R.dmca=()=>{$('#page').innerHTML=`<div class="card">${S}<button class="btn g" onclick="editDmca()">+ Submit DMCA Report</button></div><div class="card"><table><tr><th>Date</th><th>Complainant</th><th>Infringing URL</th><th>Work</th><th>Status</th><th></th></tr>${D.dmca.map(d=>`<tr><td>${d.date}</td><td>${esc(d.complainant)}<br><small>${esc(d.email)}</small></td><td>${esc(d.url)}</td><td>${esc(d.work)}</td><td><select style="width:auto" onchange="setDmca(${d.id},this.value)">${['open','review','resolved','rejected'].map(s=>`<option ${s==d.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn sm" onclick="editDmca(${d.id})">Edit</button> <button class="btn sm r" onclick="del('dmca',${d.id},R.dmca)">Delete</button></td></tr>`).join('')}</table></div>`};
function setDmca(id,s){D.dmca.find(x=>x.id==id).status=s;save();toast('Status updated')}
function editDmca(id){const d=D.dmca.find(x=>x.id==id)||{status:'open'};form(id?'Edit Report':'Submit DMCA Report',[{k:'complainant',l:'Complainant'},{k:'email',l:'Email',t:'email'},{k:'url',l:'Infringing URL'},{k:'work',l:'Copyrighted work',ta:1},{k:'status',l:'Status',opts:['open','review','resolved','rejected']}],d,o=>{if(id)Object.assign(d,o);else D.dmca.push({id:nid(D.dmca),date:new Date().toISOString().slice(0,10),...o});R.dmca()})}
window.onhashchange=()=>{if(sessionStorage.sp_user&&R[location.hash.slice(1)])go(location.hash.slice(1))};
boot();
</script></body></html>
